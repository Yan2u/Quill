<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="512" viewBox="66 63 384 384" fill="none" role="img" aria-labelledby="quill-title quill-description">
  <title id="quill-title">Quill — Graphite</title>
  <desc id="quill-description">A sculpted feather quill in three satin-glass petals. Charcoal, slate, and silver. Enlarged, centered, and angled 45 degrees on a transparent background.</desc>
  <defs>
    <path id="petal-violet" d="M259 64C207 72 163 111 151 164C135 235 158 291 207 341C233 368 249 391 253 414C270 393 278 360 275 326C271 280 254 244 247 205C239 158 244 103 259 64Z"/>
    <path id="petal-blue" d="M266 48C292 86 308 130 301 175C295 218 273 250 269 293C265 336 279 364 270 397L257 418C257 378 233 341 216 305C197 264 196 224 211 180C227 132 254 81 266 48Z"/>
    <path id="petal-cyan" d="M318 119C341 158 341 201 321 241C307 269 284 295 278 326C273 355 278 376 270 398L257 418C263 379 246 349 246 315C246 276 266 245 286 211C308 175 317 144 318 119Z"/>
    <clipPath id="feather-clip">
      <use xlink:href="#petal-violet"/>
      <use xlink:href="#petal-blue"/>
      <use xlink:href="#petal-cyan"/>
    </clipPath>
    <clipPath id="blue-clip"><use xlink:href="#petal-blue"/></clipPath>
    <clipPath id="cyan-clip"><use xlink:href="#petal-cyan"/></clipPath>
    <mask id="behind-blue" x="130" y="40" width="225" height="395" maskUnits="userSpaceOnUse">
      <rect x="130" y="40" width="225" height="395" fill="#FFFFFF"/>
      <use xlink:href="#petal-blue" fill="#000000"/>
    </mask>
    <mask id="behind-cyan" x="130" y="40" width="225" height="395" maskUnits="userSpaceOnUse">
      <rect x="130" y="40" width="225" height="395" fill="#FFFFFF"/>
      <use xlink:href="#petal-cyan" fill="#000000"/>
    </mask>
    <linearGradient id="violet-satin" x1="145" y1="158" x2="285" y2="281" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B2B7C4"/>
      <stop offset=".23" stop-color="#979DAC"/>
      <stop offset=".54" stop-color="#747D8E"/>
      <stop offset=".79" stop-color="#515A6D"/>
      <stop offset="1" stop-color="#323B4C"/>
    </linearGradient>
    <radialGradient id="violet-light" cx="0" cy="0" r="1" gradientTransform="translate(170 174) rotate(-12) scale(57 168)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E5E7EB" stop-opacity=".40"/>
      <stop offset=".48" stop-color="#D1D4DC" stop-opacity=".16"/>
      <stop offset="1" stop-color="#C1C5D0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blue-glass" x1="211" y1="147" x2="296" y2="282" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E0E6EF" stop-opacity=".94"/>
      <stop offset=".23" stop-color="#C6CFDD" stop-opacity=".93"/>
      <stop offset=".46" stop-color="#A8B6C9" stop-opacity=".90"/>
      <stop offset=".71" stop-color="#8899B0" stop-opacity=".87"/>
      <stop offset="1" stop-color="#62758F" stop-opacity=".90"/>
    </linearGradient>
    <radialGradient id="blue-light" cx="0" cy="0" r="1" gradientTransform="translate(227 155) rotate(66) scale(190 77)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F9FAFC" stop-opacity=".44"/>
      <stop offset=".55" stop-color="#EEF1F6" stop-opacity=".13"/>
      <stop offset="1" stop-color="#EEF1F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blue-contour" x1="198" y1="240" x2="308" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".24" stop-color="#FAFBFD" stop-opacity=".18"/>
      <stop offset=".56" stop-color="#FAFBFD" stop-opacity="0"/>
      <stop offset="1" stop-color="#62758F" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="cyan-glass" x1="304" y1="135" x2="254" y2="399" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F1F4F7" stop-opacity=".96"/>
      <stop offset=".23" stop-color="#DBE2EA" stop-opacity=".93"/>
      <stop offset=".48" stop-color="#C0CCDA" stop-opacity=".88"/>
      <stop offset=".74" stop-color="#9DACBF" stop-opacity=".83"/>
      <stop offset="1" stop-color="#7B8DA5" stop-opacity=".86"/>
    </linearGradient>
    <radialGradient id="cyan-light" cx="0" cy="0" r="1" gradientTransform="translate(283 219) rotate(117) scale(140 44)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FCFDFD" stop-opacity=".40"/>
      <stop offset=".47" stop-color="#F7F9FB" stop-opacity=".16"/>
      <stop offset="1" stop-color="#F7F9FB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyan-contour" x1="244" y1="240" x2="338" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#62758F" stop-opacity=".07"/>
      <stop offset=".27" stop-color="#FDFDFE" stop-opacity=".21"/>
      <stop offset=".64" stop-color="#FDFDFE" stop-opacity=".03"/>
      <stop offset="1" stop-color="#9DACBF" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="nib-ink" x1="246" y1="395" x2="280" y2="433" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6A7C95"/>
      <stop offset=".48" stop-color="#435269"/>
      <stop offset="1" stop-color="#293345"/>
    </linearGradient>
    <linearGradient id="nib-facet" x1="274" y1="410" x2="261" y2="446" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C4CDDA" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8899B0" stop-opacity=".10"/>
    </linearGradient>
    <filter id="layer-shadow" x="130" y="40" width="225" height="395" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.2"/>
      <feOffset dx="1" dy="2"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.196  0 0 0 0 0.231  0 0 0 0 0.298  0 0 0 .20 0"/>
    </filter>
    <filter id="frost" x="130" y="40" width="225" height="395" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <g id="violet-layer">
      <use xlink:href="#petal-violet" fill="url(#violet-satin)"/>
      <use xlink:href="#petal-violet" fill="url(#violet-light)"/>
    </g>
    <g id="rear-layers">
      <use xlink:href="#violet-layer" mask="url(#behind-blue)"/>
      <g clip-path="url(#feather-clip)">
        <use xlink:href="#petal-blue" filter="url(#layer-shadow)" fill="#000000"/>
      </g>
      <g clip-path="url(#blue-clip)">
        <use xlink:href="#violet-layer" filter="url(#frost)"/>
      </g>
      <use xlink:href="#petal-blue" fill="url(#blue-glass)"/>
      <use xlink:href="#petal-blue" fill="url(#blue-light)"/>
      <use xlink:href="#petal-blue" fill="url(#blue-contour)"/>
    </g>
  </defs>
  <g transform="translate(-10 8) rotate(45 256 256)">
    <path d="M248 391C255 397 264 399 270 394L268 421L266 448L250 421Z" fill="url(#nib-ink)"/>
    <path d="M269 404L268 421L266 448L260 418Z" fill="url(#nib-facet)"/>
    <use xlink:href="#rear-layers" mask="url(#behind-cyan)"/>
    <g clip-path="url(#feather-clip)">
      <use xlink:href="#petal-cyan" filter="url(#layer-shadow)" fill="#000000"/>
    </g>
    <g clip-path="url(#cyan-clip)">
      <use xlink:href="#rear-layers" filter="url(#frost)"/>
    </g>
    <use xlink:href="#petal-cyan" fill="url(#cyan-glass)"/>
    <use xlink:href="#petal-cyan" fill="url(#cyan-light)"/>
    <use xlink:href="#petal-cyan" fill="url(#cyan-contour)"/>
  </g>
</svg>
