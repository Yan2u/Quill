      <stop stop-color="#6A7C95"/>
      <stop offset=".48" stop-color="#435269"/>
      <stop offset="1" stop-color="#293345"/>
    </linearGradient>
    <linearGradient id="q-nib-facet" x1="274" y1="410" x2="261" y2="446" gradientUnits="userSpaceOnUse">
