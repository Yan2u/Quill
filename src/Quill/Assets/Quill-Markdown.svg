    <path id="q-petal-blue" d="M266 48C292 86 308 130 301 175C295 218 273 250 269 293C265 336 279 364 270 397L257 418C257 378 233 341 216 305C197 264 196 224 211 180C227 132 254 81 266 48Z"/>
