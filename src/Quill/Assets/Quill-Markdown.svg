<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="file-title file-description">
  <title id="file-title">Quill Markdown file — Graphite</title>
  <desc id="file-description">A satin silver and pearl document with a folded corner, the classic Markdown M and downward arrow, and the original three-petal Graphite Quill mark on a transparent background.</desc>
